[project]
name = "fastapi-tdd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "nltk>=3.10.3",
    "pydantic-settings>=2.15.0",
    "tortoise-orm[asyncpg]>=1.1.8",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.ruff.lint.per-file-ignores]
"app/migrations/*.py" = ["RUF012"]

[tool.pytest.ini_options]
markers = [
    "integration: requires the dedicated summaries-test PostgreSQL database",
]
