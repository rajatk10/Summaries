name: summaries-integration

services:
  test-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: summaries-test
      POSTGRES_USER: summaries_test
      POSTGRES_PASSWORD: summaries_test
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U summaries_test -d summaries-test
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql