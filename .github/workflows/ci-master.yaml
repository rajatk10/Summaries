name: Master CI

on:
  push:
    branches:
      - master

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      test-db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: summaries-test
          POSTGRES_USER: summaries_test
          POSTGRES_PASSWORD: summaries_test
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U summaries_test -d summaries-test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://summaries_test:summaries_test@127.0.0.1:15433/summaries-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run tortoise -c app.config.TORTOISE_ORM migrate

      - name: Run integration tests
        run: uv run pytest tests/integration -m integration -v

  docker-release:
    name: Build and Push Versioned Image
    runs-on: ubuntu-latest
    needs: [integration-tests]

    permissions:
      contents: write   # required to push the new git semver tag
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for semver tag bump

      - name: Bump semantic version tag
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Conventional commit bump rules:
          #   fix: / patch:      → patch  (1.0.0 → 1.0.1)
          #   feat:              → minor  (1.0.0 → 1.1.0)
          #   BREAKING CHANGE    → major  (1.0.0 → 2.0.0)
          # Falls back to patch if no conventional prefix is found.
          default_bump: patch
          tag_prefix: "v"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.new_tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
